name: Phase 2 builder spike

on:
  workflow_dispatch:
    inputs:
      paid_model:
        description: "Arm P (OpenCode x OpenRouter, PRIMARY paid builder). Must be on the allowlist in spike/allowed-model.mjs; anything else aborts as a config error."
        type: string
        default: "anthropic/claude-haiku-4.5"
      include_paid_arm:
        description: "Arm P on/off. Spend is capped at PF_SPEND_CEILING (2.00 USD) per dispatch."
        type: boolean
        default: true
      arm_a_model:
        description: "Arm A (OpenCode x OpenRouter, primary) — explicit :free id; the run refuses anything else and never substitutes."
        type: string
        default: "cohere/north-mini-code:free"
      arm_b_model:
        description: "Arm B (Aider diff x OpenRouter, control) — explicit :free id."
        type: string
        default: "poolside/laguna-s-2.1:free"
      nvidia_model:
        description: "Arm C (OpenCode x NVIDIA, overflow) — bare NIM id."
        type: string
        default: "nvidia/nemotron-3-ultra-550b-a55b"
      nvidia_fallback_model:
        description: "Arm C fallback, used only if nvidia_model is unlisted or rejects the full prompt in preflight."
        type: string
        default: "moonshotai/kimi-k3"
      include_arm_c:
        description: "Deferred: Arm C (OpenCode x NVIDIA kimi-k3). Free-tier builder selection is deferred to after Phase 2 closes; kimi-k3 unresolved."
        type: boolean
        default: false
      include_arm_a:
        description: "Retired: Arm A (OpenCode x north-mini-code:free) - 25 reads, 0 writes in dispatch 1 (builder verdict). Quota freed."
        type: boolean
        default: false
      include_arm_b:
        description: "Arm B (Aider diff x OpenRouter laguna-s-2.1:free). Off for dispatch 5 (arm C only)."
        type: boolean
        default: false
      include_gemini_cli_arm:
        description: "Retired: Gemini CLI x OpenRouter (litellm proxy + selectedType pin; no outcome is attributable). Adapter kept."
        type: boolean
        default: false
      include_gemini_control:
        description: "Retired: Aider x Gemini control (20 req/day, spent, answers nothing)."
        type: boolean
        default: false
      brief_path:
        description: "Brief the builder implements, relative to the repo root."
        type: string
        default: "spike/inputs/sample-brief.json"
      deepseek_arm:
        description: "Arm P-DS (OpenCode x DeepSeek direct). Needs only DEEPSEEK_API_KEY; skips the OpenRouter preflight, allowlist and spend ceiling. Unmetered by design: cost is computed from reported tokens."
        type: boolean
        default: true
      deepseek_model:
        description: "Arm P-DS model, bare DeepSeek id (bare alias, no pinned snapshot)."
        type: string
        default: "deepseek-flash"

permissions:
  contents: write

# Arms are chained with `needs`, so exactly one runs at a time (max-parallel 1).
concurrency:
  group: build
  cancel-in-progress: false

env:
  # Pinned: an OpenCode/Aider/Node version mismatch is a silent class of failure.
  # Exact versions are logged by run-arm.sh and recorded in each result.json.
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"
  OPENCODE_VERSION: "1.18.31"
  AIDER_VERSION: "0.86.2"
  PAID_MODEL: ${{ inputs.paid_model }}
  DEEPSEEK_MODEL: ${{ inputs.deepseek_model }}
  PF_BRIEF_PATH: ${{ inputs.brief_path }}
  # Hard spend ceiling for the whole dispatch, USD, checked against OpenRouter /key (spike/spend.mjs). Not an input on purpose.
  PF_SPEND_CEILING: "2.00"
  ARM_A_MODEL: ${{ inputs.arm_a_model }}
  ARM_B_MODEL: ${{ inputs.arm_b_model }}
  NVIDIA_MODEL: ${{ inputs.nvidia_model }}
  NVIDIA_FALLBACK_MODEL: ${{ inputs.nvidia_fallback_model }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets are present
        run: |
          missing=""
          if [ "${{ inputs.include_paid_arm || inputs.include_arm_a || inputs.include_arm_b }}" = "true" ] && [ -z "${{ secrets.OPENROUTER_API_KEY }}" ]; then
            missing="$missing OPENROUTER_API_KEY"
          fi
          if [ "${{ inputs.include_arm_c }}" = "true" ] && [ -z "${{ secrets.NVIDIA_API_KEY }}" ]; then
            missing="$missing NVIDIA_API_KEY"
          fi
          if [ "${{ inputs.include_gemini_cli_arm || inputs.include_gemini_control }}" = "true" ] && [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            missing="$missing GEMINI_API_KEY"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Missing required secret(s):$missing"
            exit 1
          fi
          # Allowlist (spike/allowed-model.mjs): the paid builder plus any :free id. Only models whose arm is on are checked.
          [ "${{ inputs.include_paid_arm }}" = "true" ] && { node spike/allowed-model.mjs "${{ inputs.paid_model }}" || exit 1; }
          [ "${{ inputs.include_arm_a }}" = "true" ] && { node spike/allowed-model.mjs "${{ inputs.arm_a_model }}" || exit 1; }
          [ "${{ inputs.include_arm_b }}" = "true" ] && { node spike/allowed-model.mjs "${{ inputs.arm_b_model }}" || exit 1; }
          exit 0

  # Hard gate: fails (skipping every arm) unless some model accepts the full
  # ~16KB builder prompt, or if a configured model is within 14 days of deprecation.
  provider-preflight:
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      or_p_ok: ${{ steps.pf.outputs.or_p_ok }}
      or_usage_start: ${{ steps.pf.outputs.or_usage_start }}
      or_a_ok: ${{ steps.pf.outputs.or_a_ok }}
      or_b_ok: ${{ steps.pf.outputs.or_b_ok }}
      nvidia_ok: ${{ steps.pf.outputs.nvidia_ok }}
      nvidia_model: ${{ steps.pf.outputs.nvidia_model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - run: node --version
      - id: pf
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          INCLUDE_PAID_ARM: ${{ inputs.include_paid_arm }}
          INCLUDE_ARM_A: ${{ inputs.include_arm_a }}
          INCLUDE_ARM_B: ${{ inputs.include_arm_b }}
          INCLUDE_ARM_C: ${{ inputs.include_arm_c }}
        run: node spike/preflight-providers.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-preflight
          path: spike/out/preflight-providers.json
          if-no-files-found: ignore

  # Arm P: the paid primary builder. Metered against OpenRouter /key: spike/spend.mjs before and after each
  # attempt, and the supervisor after every step; aborts the arm at PF_SPEND_CEILING.
  arm-p-opencode-openrouter-paid:
    needs: provider-preflight
    if: inputs.include_paid_arm && needs.provider-preflight.outputs.or_p_ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm install -g opencode-ai@${{ env.OPENCODE_VERSION }}
      - env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PF_SPEND_START: ${{ needs.provider-preflight.outputs.or_usage_start }}
        run: |
          chmod +x spike/run-arm.sh
          ./spike/run-arm.sh opencode-openrouter-paid opencode "openrouter/$PAID_MODEL" || [ $? -eq 2 ]
      - name: Collect evidence into the arm's artifact folder
        if: always()
        run: |
          out=spike/out/opencode-openrouter-paid/evidence
          mkdir -p "$out"
          rsync -a --exclude node_modules --exclude dist prototypes/prior-auth-tracker-v1/ "$out/workspace/" || true
          for d in test-results playwright-report shots; do [ -d "$d" ] && cp -r "$d" "$out/$d"; done
          true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-arm-p-opencode-openrouter-paid
          path: spike/out/opencode-openrouter-paid
          if-no-files-found: ignore

  # Arm P-DS: DeepSeek direct. No `needs`: arm P only needs provider-preflight, which is OpenRouter-specific and
  # exits 1 when no OpenRouter/NVIDIA arm is on. Needs only DEEPSEEK_API_KEY. Unmetered by design (no spend.mjs,
  # PF_SPEND_CEILING is never read for a deepseek/ id); cost is computed from reported tokens by run-opencode.mjs.
  arm-p-opencode-deepseek:
    if: inputs.deepseek_arm == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fail fast if DEEPSEEK_API_KEY is empty
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          [ -n "$DEEPSEEK_API_KEY" ] || { echo "::error::DEEPSEEK_API_KEY secret is empty or not set"; exit 1; }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm install -g opencode-ai@${{ env.OPENCODE_VERSION }}
      - env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          chmod +x spike/run-arm.sh
          ./spike/run-arm.sh opencode-deepseek opencode "deepseek/$DEEPSEEK_MODEL" || [ $? -eq 2 ]
      - name: Collect evidence into the arm's artifact folder
        if: always()
        run: |
          out=spike/out/opencode-deepseek/evidence
          mkdir -p "$out"
          rsync -a --exclude node_modules --exclude dist prototypes/prior-auth-tracker-v1/ "$out/workspace/" || true
          for d in test-results playwright-report shots; do [ -d "$d" ] && cp -r "$d" "$out/$d"; done
          true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-arm-p-opencode-deepseek
          path: spike/out/opencode-deepseek
          if-no-files-found: ignore

  arm-a-opencode-openrouter:
    needs: [provider-preflight, arm-p-opencode-openrouter-paid]
    if: always() && inputs.include_arm_a && needs.provider-preflight.outputs.or_a_ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      quota_exhausted: ${{ steps.run.outputs.quota_exhausted }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm install -g opencode-ai@${{ env.OPENCODE_VERSION }}
      - id: run
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          chmod +x spike/run-arm.sh
          code=0
          ./spike/run-arm.sh opencode-openrouter opencode "openrouter/$ARM_A_MODEL" || code=$?
          echo "quota_exhausted=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ "$code" -eq 0 ] || [ "$code" -eq 2 ] || exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-arm-a-opencode-openrouter
          path: spike/out/opencode-openrouter
          if-no-files-found: ignore

  arm-b-aider-openrouter:
    needs: [provider-preflight, arm-a-opencode-openrouter]
    # Shares the 1,000/day OpenRouter pool with arm A: skip if A hit the daily cap.
    if: always() && inputs.include_arm_b && needs.provider-preflight.outputs.or_b_ok == 'true' && needs.arm-a-opencode-openrouter.outputs.quota_exhausted != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      quota_exhausted: ${{ steps.run.outputs.quota_exhausted }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: pip install aider-chat==${{ env.AIDER_VERSION }}
      - id: run
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          chmod +x spike/run-arm.sh
          code=0
          ./spike/run-arm.sh aider-openrouter aider "openrouter/$ARM_B_MODEL" || code=$?
          echo "quota_exhausted=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ "$code" -eq 0 ] || [ "$code" -eq 2 ] || exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-arm-b-aider-openrouter
          path: spike/out/aider-openrouter
          if-no-files-found: ignore

  arm-c-opencode-nvidia:
    needs: [provider-preflight, arm-b-aider-openrouter]
    # No burst-429 skip rule: calls are paced 1/4s by the supervisor, which aborts on 3 consecutive 429s.
    if: always() && inputs.include_arm_c && needs.provider-preflight.outputs.nvidia_ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm install -g opencode-ai@${{ env.OPENCODE_VERSION }}
      - env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CHOSEN_NVIDIA_MODEL: ${{ needs.provider-preflight.outputs.nvidia_model }}
        run: |
          chmod +x spike/run-arm.sh
          ./spike/run-arm.sh opencode-nvidia opencode "$CHOSEN_NVIDIA_MODEL" nvidia || [ $? -eq 2 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-arm-c-opencode-nvidia
          path: spike/out/opencode-nvidia
          if-no-files-found: ignore

  # Retired (off by default via include_gemini_cli_arm): double-confounded by the
  # LiteLLM proxy plus the selectedType pin. Adapter code stays in place.
  arm-d-gemini-cli-openrouter:
    needs: [provider-preflight, arm-a-opencode-openrouter, arm-b-aider-openrouter, arm-c-opencode-nvidia]
    if: always() && inputs.include_gemini_cli_arm && needs.provider-preflight.outputs.or_a_ok == 'true' && needs.arm-a-opencode-openrouter.outputs.quota_exhausted != 'true' && needs.arm-b-aider-openrouter.outputs.quota_exhausted != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      harness_error: ${{ steps.proxy.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm install -g @google/gemini-cli
      # Failure here is a HARNESS failure (reported as such), not a builder one.
      - id: proxy
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          chmod +x spike/start-proxy.sh
          ./spike/start-proxy.sh spike/out/gemini-cli-openrouter
      - if: steps.proxy.outcome == 'success'
        run: |
          chmod +x spike/run-arm.sh
          ./spike/run-arm.sh gemini-cli-openrouter gemini-cli "openrouter/$ARM_A_MODEL" || [ $? -eq 2 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-arm-d-gemini-cli-openrouter
          path: spike/out/gemini-cli-openrouter
          if-no-files-found: ignore

  # Retired (off by default via include_gemini_control): daily quota is spent.
  arm-e-aider-gemini:
    needs: [provider-preflight, arm-d-gemini-cli-openrouter]
    if: always() && inputs.include_gemini_control
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: pip install aider-chat==${{ env.AIDER_VERSION }}
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          chmod +x spike/run-arm.sh
          ./spike/run-arm.sh aider-gemini aider gemini/gemini-flash-latest || [ $? -eq 2 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-arm-e-aider-gemini
          path: spike/out/aider-gemini
          if-no-files-found: ignore

  report:
    needs: [provider-preflight, arm-p-opencode-openrouter-paid, arm-p-opencode-deepseek, arm-a-opencode-openrouter, arm-b-aider-openrouter, arm-c-opencode-nvidia, arm-d-gemini-cli-openrouter, arm-e-aider-gemini]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: spike/out
          pattern: "spike-arm-*"
          merge-multiple: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: spike-preflight
          path: spike/out
          merge-multiple: true
      - name: Build results table and pick a winner
        env:
          PAID_MODEL: ${{ inputs.paid_model }}
          INCLUDE_PAID_ARM: ${{ inputs.include_paid_arm }}
          INCLUDE_ARM_C: ${{ inputs.include_arm_c }}
          OR_P_OK: ${{ needs.provider-preflight.outputs.or_p_ok }}
          ARM_A_MODEL: ${{ inputs.arm_a_model }}
          ARM_B_MODEL: ${{ inputs.arm_b_model }}
          NVIDIA_MODEL: ${{ inputs.nvidia_model }}
          INCLUDE_ARM_A: ${{ inputs.include_arm_a }}
          INCLUDE_ARM_B: ${{ inputs.include_arm_b }}
          INCLUDE_GEMINI_CLI_ARM: ${{ inputs.include_gemini_cli_arm }}
          INCLUDE_GEMINI_CONTROL: ${{ inputs.include_gemini_control }}
          PREFLIGHT_RESULT: ${{ needs.provider-preflight.result }}
          OR_A_OK: ${{ needs.provider-preflight.outputs.or_a_ok }}
          OR_B_OK: ${{ needs.provider-preflight.outputs.or_b_ok }}
          NVIDIA_OK: ${{ needs.provider-preflight.outputs.nvidia_ok }}
          ARM_A_QUOTA_EXHAUSTED: ${{ needs.arm-a-opencode-openrouter.outputs.quota_exhausted }}
          ARM_B_QUOTA_EXHAUSTED: ${{ needs.arm-b-aider-openrouter.outputs.quota_exhausted }}
          ARM_D_HARNESS_ERROR: ${{ needs.arm-d-gemini-cli-openrouter.outputs.harness_error }}
        run: node spike/report.mjs
      - name: Publish results to spike-results branch
        if: always()
        run: |
          git config user.name "umakescloud-max"
          git config user.email "umakescloud@gmail.com"
          git checkout --orphan spike-results-tmp
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p results
          cp spike/DECISIONS-spike-table.md results/ 2>/dev/null || true
          cp spike/winner-cover.png results/cover.png 2>/dev/null || true
          cp spike/winner-denials.png results/denials-1280x800.png 2>/dev/null || true
          git add results
          git commit -m "Phase 2 spike results $(date -u +%F)" || echo "nothing to commit"
          git branch -D spike-results 2>/dev/null || true
          git branch -m spike-results
          git push -f origin spike-results
